
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610" role="img" aria-labelledby="title desc">
<title id="title">Richard Castro Gois - Animated full stack profile</title>
<desc id="desc">Retrato formado por caracteres ASCII com animação suave e perfil profissional com Go, React, TypeScript e IA</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0f1723"/>
<stop offset="0.56" stop-color="#0b111a"/>
<stop offset="1" stop-color="#090e15"/>
</linearGradient>

<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
<stop stop-color="#58a6ff" stop-opacity=".65"/>
<stop offset="1" stop-color="#2ea043" stop-opacity=".6"/>
</linearGradient>

<pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
<path d="M35 0H0V35" fill="none" stroke="#1c3144" stroke-opacity=".24"/>
</pattern>

<style>
@keyframes appear {
  from { opacity:0; transform:translateY(12px); }
  to { opacity:1; transform:translateY(0); }
}
.intro{font-family:monospace;font-weight:500;font-size:12px;letter-spacing:2.5px;fill:#7d8590}
.heading{font-family:sans-serif;font-weight:700;font-size:47px;fill:#f0f6fc}
.subheading{font-family:sans-serif;font-weight:500;font-size:22px;fill:#c9d1d9}
.label{font-family:monospace;font-weight:700;font-size:15px;fill:#8b949e}
.value{font-family:monospace;font-weight:500;font-size:16px;fill:#e6edf3}
.kicker{font-family:monospace;font-weight:700;font-size:12px;letter-spacing:1.8px;fill:#58a6ff}
.row{animation:appear .5s ease both}
</style>
</defs>

<rect width="1080" height="610" rx="17" fill="url(#bg)"/>
<rect width="1080" height="610" rx="17" fill="url(#grid)"/>
<rect x="1" y="1" width="1078" height="608" rx="16" fill="none" stroke="url(#edge)" stroke-opacity=".6" stroke-width="1.4"/>

<line x1="0" y1="38" x2="1080" y2="38" stroke="#30363d" stroke-opacity=".75"/>

<circle cx="27" cy="19" r="6" fill="#ff5f56"/>
<circle cx="47" cy="19" r="6" fill="#ffbd2e"/>
<circle cx="67" cy="19" r="6" fill="#27c93f"/>

<text x="540" y="24" class="intro" text-anchor="middle" style="letter-spacing:1px">RICHARD CASTRO GOIS / DEVELOPER PROFILE</text>

<!-- Retrato ASCII sem moldura ou recorte circular -->
<!-- Entrada suave com fade-in e movimento vertical -->

<g id="asciiPortrait" opacity="0">

<animate
  attributeName="opacity"
  from="0"
  to="1"
  dur="2.4s"
  begin="0s"
  fill="freeze"
  calcMode="spline"
  keyTimes="0;1"
  keySplines="0.22 1 0.36 1"
/>

<animateTransform
  attributeName="transform"
  type="translate"
  from="0 14"
  to="0 0"
  dur="2.4s"
  begin="0s"
  fill="freeze"
  calcMode="spline"
  keyTimes="0;1"
  keySplines="0.22 1 0.36 1"
/>

